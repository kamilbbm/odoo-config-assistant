        - content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_two_steps.rst
    - id: products
      label: Articles
      parameters:
      - id: units_of_measure
        label: Unités de mesure
        sources:
        - content/applications/inventory_and_mrp/inventory/product_management/configure/uom.rst
      - id: product_categories
        label: Catégories et valorisation
        sources:
        - content/applications/inventory_and_mrp/inventory/product_management/inventory_valuation/inventory_valuation_config.rst
      - id: traceability
        label: Traçabilité
        sources:
        - content/applications/inventory_and_mrp/inventory/product_management/product_tracking/lots.rst
    - id: replenishment
      label: Réapprovisionnement
      parameters:
      - id: reordering_rules
        label: Règles de réapprovisionnement
        sources:
        - content/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/reordering_rules.rst
      - id: make_to_order
        label: Fabrication à la commande
        sources:
        - content/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/mto.rst
    - id: stock_counting
      label: Inventaire physique
      parameters:
      - id: initial_quantities
        label: Stock initial
        sources:
        - content/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/count_products.rst
  - id: purchase
    label: Achats
    odoo_modules:
    - purchase
    processes:
    - id: procurement
      label: Approvisionnement
      parameters:
      - id: purchased_components
        label: Composants achetés
        sources:
