      - id: warehouse
        label: Entrepôt
        sources:
        - content/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/warehouses.rst
      - id: locations
        label: Emplacements
        sources:
        - content/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/use_locations.rst
    - id: logistics_flows
      label: Flux logistiques
      parameters:
      - id: routes
        label: Routes
        sources:
        - content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/use_routes.rst
      - id: receipts
        label: Réceptions
        sources:
        - content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_one_step.rst
        - content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_two_steps.rst
        - content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_three_steps.rst
      - id: deliveries
        label: Livraisons
        sources:
