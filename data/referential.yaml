# Référentiel métier (F-004) : Domaine > Module > Processus > Paramètre, Odoo 18.
# Chaque paramètre est rattaché à des pages de la documentation (unités indexées) ; chaque étape
# de parcours est rattachée à un paramètre (champ parameter). Les domaines sans parcours
# modélisé sont listés pour structurer la suite (SFD 1.1).

erp: odoo
version: '18.0'
domains:
- id: finance
  label: Finance
  modules:
  - id: accounting
    label: Comptabilité
    odoo_modules:
    - account
    - account_accountant
    processes:
    - id: fiscal_setup
      label: Paramétrage fiscal
      parameters:
      - id: company_identity
        label: Identité légale de la société
        sources:
        - content/applications/finance/fiscal_localizations/france.rst
        - content/applications/general/companies.rst
      - id: fiscal_localization
        label: Localisation fiscale
        sources:
        - content/applications/finance/fiscal_localizations.rst
        - content/applications/finance/fiscal_localizations/canada.rst
        - content/applications/finance/fiscal_localizations/france.rst
      - id: taxes
        label: Taxes de vente et d'achat
        sources:
        - content/applications/finance/accounting/taxes.rst
        - content/applications/finance/fiscal_localizations/canada.rst
        - content/applications/finance/fiscal_localizations/france.rst
      - id: fiscal_positions
        label: Positions fiscales
        sources:
        - content/applications/finance/accounting/taxes/fiscal_positions.rst
        - content/applications/finance/fiscal_localizations/canada.rst
        - content/applications/finance/fiscal_localizations/france.rst
      - id: tax_returns
        label: Déclarations de taxes
        sources:
        - content/applications/finance/accounting/reporting/tax_returns.rst
        - content/applications/finance/fiscal_localizations/france.rst
    - id: accounting_structure
      label: Structure comptable
      parameters:
      - id: main_currency
        label: Devise principale
        sources:
        - content/applications/finance/accounting/get_started/multi_currency.rst
      - id: foreign_currencies
        label: Devises étrangères
        sources:
        - content/applications/finance/accounting/get_started/multi_currency.rst
      - id: fiscal_year
        label: Exercice fiscal
        sources:
        - content/applications/finance/accounting/get_started.rst
        - content/applications/finance/accounting/reporting/year_end.rst
      - id: chart_of_accounts
        label: Plan comptable
        sources:
        - content/applications/finance/accounting/get_started/chart_of_accounts.rst
        - content/applications/finance/fiscal_localizations/canada.rst
        - content/applications/finance/fiscal_localizations/france.rst
      - id: journals
        label: Journaux
        sources:
        - content/applications/finance/accounting/get_started/journals.rst
      - id: opening_balances
        label: Soldes d'ouverture
        sources:
        - content/applications/finance/accounting/get_started.rst
        - content/applications/finance/accounting/get_started/chart_of_accounts.rst
        - content/applications/finance/fiscal_localizations/france.rst
    - id: treasury
      label: Trésorerie et paiements
      parameters:
      - id: bank_accounts
        label: Comptes bancaires
        sources:
        - content/applications/finance/accounting/get_started.rst
      - id: payment_terms
        label: Conditions de paiement
        sources:
        - content/applications/finance/accounting/customer_invoices/payment_terms.rst
        - content/applications/finance/fiscal_localizations/canada.rst
      - id: check_printing
        label: Impression des chèques
        sources:
        - content/applications/finance/fiscal_localizations/canada.rst
      - id: sepa_payments
        label: Paiements SEPA
        sources:
        - content/applications/finance/accounting/payments/sepa_payments.rst
    - id: e_invoicing
      label: Facturation électronique
      parameters:
      - id: e_invoicing_network
        label: Réseau de facturation électronique
        sources:
        - content/applications/finance/fiscal_localizations/france.rst
      - id: public_sector_invoicing
        label: Factures au secteur public
        sources:
        - content/applications/finance/fiscal_localizations/france.rst
    - id: closing
      label: Clôture et reporting
      parameters:
      - id: financial_reports
        label: Rapports financiers
        sources:
        - content/applications/finance/fiscal_localizations/canada.rst
      - id: audit_file
        label: Fichier des écritures comptables
        sources:
        - content/applications/finance/fiscal_localizations/france.rst
      - id: lock_dates
        label: Clôture et verrouillage
        sources:
        - content/applications/finance/accounting/reporting/year_end.rst
        - content/applications/finance/fiscal_localizations/france.rst
