        - content/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/reordering_rules.rst
  - id: manufacturing
    label: Fabrication
    odoo_modules:
    - mrp
    processes:
    - id: master_data
      label: Données techniques
      parameters:
      - id: work_centers
        label: Postes de travail
        sources:
        - content/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.rst
      - id: manufactured_products
        label: Produits fabriqués
        sources:
        - content/applications/inventory_and_mrp/manufacturing/basic_setup/configure_manufacturing_product.rst
      - id: bills_of_materials
        label: Nomenclatures
        sources:
        - content/applications/inventory_and_mrp/manufacturing/basic_setup/bill_configuration.rst
    - id: production
      label: Production
      parameters:
      - id: work_orders
        label: Ordres de travail
        sources:
        - content/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.rst
        - content/applications/inventory_and_mrp/manufacturing/basic_setup/bill_configuration.rst
      - id: manufacturing_steps
        label: Étapes de fabrication
        sources:
        - content/applications/inventory_and_mrp/manufacturing/basic_setup/one_step_manufacturing.rst
        - content/applications/inventory_and_mrp/manufacturing/basic_setup/two_step_manufacturing.rst
      - id: first_manufacturing_order
