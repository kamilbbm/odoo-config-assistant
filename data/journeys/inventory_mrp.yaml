# Parcours Inventaire et fabrication (Odoo 18).
# Vérifié contre odoo/documentation 18.0, commit 221e829ac894c79b0f270892c1e02425a0ef4214.
# Chemins de menu en anglais, tels qu'écrits dans la doc. verified: false = à confirmer.

id: inventory_mrp
title: Inventaire et fabrication
domain: Supply chain
description: 'PME manufacturière : entrepôts et emplacements, unités de mesure, catégories d''articles,
  routes, nomenclatures, postes de travail et ordres de fabrication.'
erp: odoo
version: '18.0'
applies_when:
  modules:
  - stock
  - mrp
steps:
- id: inv_storage_locations
  title: Emplacements de stockage
  objective: Activer la gestion de plusieurs emplacements dans un entrepôt.
  menu_path: Inventory app > Configuration > Settings
  recommendations:
  - value: 'Section Warehouse : cocher Storage Locations.'
  prerequisites: []
  sources:
  - path: content/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/use_locations.rst
    title: Locations
    anchor: use_locations/configuration
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/use_locations.html#use-locations-configuration
- id: inv_multi_step_routes
  title: Routes multi-étapes
  objective: Activer les routes pour gérer les flux de réception, de livraison et de fabrication en plusieurs
    étapes.
  menu_path: Inventory app > Configuration > Settings
  recommendations:
  - value: 'Section Warehouse : cocher Multi-Step Routes (avec Storage Locations).'
  prerequisites:
  - inv_storage_locations
  sources:
  - path: content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/use_routes.rst
    title: Routes and push/pull rules
    anchor: inventory/routes/config
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/use_routes.html#inventory-routes-config
- id: inv_warehouse
  title: Entrepôt
  objective: 'Paramétrer l''entrepôt principal : nom, code court et adresse.'
  menu_path: Inventory app > Configuration > Warehouses
  recommendations:
  - value: 'Warehouse : nom complet ; Short Name : code de 5 caractères au plus, facile à reconnaître
      sur les documents ; Address : adresse de l''usine.'
  prerequisites: []
  sources:
  - path: content/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/warehouses.rst
    title: Warehouses
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/warehouses.html
- id: inv_locations
  title: Emplacements internes
  objective: Créer les emplacements physiques de l'entrepôt (zones, allées, étagères) pour savoir où se
    trouve le stock.
  menu_path: Inventory app > Configuration > Locations
  recommendations:
  - value: Emplacements de type interne sous l'emplacement de stock de l'entrepôt (Parent Location), un
      par zone de stockage réelle.
    verified: false
    note: La doc décrit la création (Parent Location, Location Type) ; le découpage en zones dépend du
      plan de l'usine et reste à définir avec le client.
  prerequisites:
  - inv_storage_locations
  - inv_warehouse
  sources:
  - path: content/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/use_locations.rst
    title: Locations
    anchor: inventory/use_locations/create-location
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/use_locations.html#inventory-use-locations-create-location
- id: inv_receipt_steps
  title: Réceptions
  objective: Choisir le nombre d'étapes de réception des marchandises dans l'entrepôt (champ Incoming
    Shipments).
  menu_path: Inventory app > Configuration > Warehouses
  recommendations:
  - value: 'Incoming Shipments : Receive goods directly (1 step).'
    when:
      size:
      - micro
    verified: false
    note: Les libellés viennent de la doc ; le choix selon la taille de l'entreprise est une recommandation
      de consultant à confirmer avec le client.
  - value: 'Incoming Shipments : Receive goods in input and then stock (2 steps).'
    verified: false
    note: Les libellés viennent de la doc ; le choix selon la taille de l'entreprise est une recommandation
      de consultant à confirmer avec le client.
  prerequisites:
  - inv_multi_step_routes
  - inv_warehouse
  sources:
  - path: content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_one_step.rst
    title: One-step receipt and delivery
    anchor: inventory/receipts_delivery_one_step/wh
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_one_step.html#inventory-receipts-delivery-one-step-wh
  - path: content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_two_steps.rst
    title: Two-step receipt and delivery
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_two_steps.html
  - path: content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_three_steps.rst
    title: Three-step receipt
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_three_steps.html
- id: inv_delivery_steps
  title: Livraisons
  objective: Choisir le nombre d'étapes de livraison des produits finis (champ Outgoing Shipments).
  menu_path: Inventory app > Configuration > Warehouses
  recommendations:
  - value: 'Outgoing Shipments : Deliver goods directly (1 step).'
    when:
      size:
      - micro
    verified: false
    note: Les libellés viennent de la doc ; le choix selon la taille de l'entreprise est une recommandation
      de consultant à confirmer avec le client.
  - value: 'Outgoing Shipments : Send goods in output and then deliver (2 steps).'
    verified: false
    note: Les libellés viennent de la doc ; le choix selon la taille de l'entreprise est une recommandation
      de consultant à confirmer avec le client.
  prerequisites:
  - inv_multi_step_routes
  - inv_warehouse
  sources:
  - path: content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_two_steps.rst
    title: Two-step receipt and delivery
    anchor: inventory/shipping_receiving/two-step-delivery
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/receipts_delivery_two_steps.html#inventory-shipping-receiving-two-step-delivery
  - path: content/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/delivery_three_steps.rst
    title: Three-step delivery
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/shipping_receiving/daily_operations/delivery_three_steps.html
- id: inv_uom
  title: Unités de mesure
  objective: Activer les unités de mesure pour acheter, stocker et consommer les articles dans des unités
    différentes.
  menu_path: Inventory app > Configuration > Settings
  recommendations:
  - value: 'Section Products : cocher Units of Measure, puis vérifier les catégories (UoM Categories)
      : une conversion n''est possible qu''entre unités d''une même catégorie.'
  prerequisites: []
  sources:
  - path: content/applications/inventory_and_mrp/inventory/product_management/configure/uom.rst
    title: Units of measure
    anchor: inventory/uom/categories
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/product_management/configure/uom.html#inventory-uom-categories
- id: inv_product_categories
  title: Catégories d'articles et valorisation
  objective: Créer les catégories d'articles (matières premières, composants, produits finis) et fixer
    leur méthode de coût et leur valorisation du stock.
  menu_path: Inventory app > Configuration > Product Categories
  recommendations:
  - value: 'Costing Method : Average Cost (AVCO) ; Inventory Valuation : Automated, avec les comptes de
      valorisation du plan comptable (Automatic Accounting activé dans la comptabilité).'
    when:
      modules:
      - account
    verified: false
    note: Les options viennent de la doc ; le choix AVCO et valorisation automatique est une recommandation
      à valider avec le comptable.
  - value: 'Costing Method : Average Cost (AVCO) ; Inventory Valuation : Manual.'
    verified: false
    note: Sans module Comptabilité, la valorisation reste manuelle ; le choix AVCO est une recommandation
      à valider.
  prerequisites:
  - inv_uom
  - fin_chart_of_accounts
  sources:
  - path: content/applications/inventory_and_mrp/inventory/product_management/inventory_valuation/inventory_valuation_config.rst
    title: Automatic inventory valuation
    anchor: inventory/warehouses_storage/valuation-on-product-category
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/product_management/inventory_valuation/inventory_valuation_config.html#inventory-warehouses-storage-valuation-on-product-category
- id: inv_components
  title: Composants et matières premières achetés
  objective: 'Paramétrer les articles achetés : fournisseur, prix et délai de livraison, route d''achat.'
  menu_path: Purchase app > Products > Products
  recommendations:
  - value: 'Pour chaque composant : case Purchase cochée, au moins un fournisseur dans l''onglet Purchase
      (Vendor, Price, Delivery Lead Time), route Buy cochée dans l''onglet Inventory.'
  prerequisites:
  - inv_uom
  - inv_product_categories
  applies_when:
    modules:
    - purchase
  sources:
  - path: content/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/reordering_rules.rst
    title: Reordering rules
    anchor: inventory/warehouses_storage/set-product-type
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/reordering_rules.html#inventory-warehouses-storage-set-product-type
  - path: content/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/lead_times.rst
    title: Lead times
    anchor: inventory/warehouses_storage/purchase-lt
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/lead_times.html#inventory-warehouses-storage-purchase-lt
- id: inv_lots
  title: Lots et numéros de série
  objective: Activer la traçabilité par lots pour suivre les matières et les produits finis.
  menu_path: Inventory app > Configuration > Settings
  recommendations:
  - value: 'Section Traceability : cocher Lots & Serial Numbers, puis Tracking By Lots sur les articles
      suivis.'
  prerequisites:
  - inv_product_categories
  applies_when:
    tracks_lots: true
  sources:
  - path: content/applications/inventory_and_mrp/inventory/product_management/product_tracking/lots.rst
    title: Lot numbers
    anchor: inventory/management/track_products_by_lots
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/product_management/product_tracking/lots.html#inventory-management-track-products-by-lots
- id: mrp_work_orders
  title: Ordres de travail
  objective: Activer les ordres de travail, nécessaires pour les postes de travail et les opérations des
    nomenclatures.
  menu_path: Manufacturing app > Configuration > Settings
  recommendations:
  - value: 'Section Operations : cocher Work Orders.'
  prerequisites: []
  applies_when:
    modules:
    - mrp
  sources:
  - path: content/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.rst
    title: Work centers
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.html
  - path: content/applications/inventory_and_mrp/manufacturing/basic_setup/bill_configuration.rst
    title: Bill of materials
    anchor: manufacturing/basic_setup/setup-operations
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/manufacturing/basic_setup/bill_configuration.html#manufacturing-basic-setup-setup-operations
- id: mrp_work_centers
  title: Postes de travail
  objective: Créer les postes de travail où se déroulent les opérations de fabrication.
  menu_path: Manufacturing app > Configuration > Work Centers
  recommendations:
  - value: Un poste par machine ou équipe de production, avec ses heures de travail.
  prerequisites:
  - mrp_work_orders
  applies_when:
    modules:
    - mrp
  sources:
  - path: content/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.rst
    title: Work centers
    anchor: manufacturing/management/using_work_centers/wc-setup
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/manufacturing/advanced_configuration/using_work_centers.html#manufacturing-management-using-work-centers-wc-setup
- id: mrp_manufacturing_steps
  title: Étapes de fabrication
  objective: Choisir le nombre d'étapes de fabrication de l'entrepôt (champ Manufacture).
  menu_path: Inventory > Configuration > Warehouses
  recommendations:
  - value: 'Manufacture : Manufacture (1 step).'
    when:
      size:
      - micro
    verified: false
    note: Les libellés viennent de la doc ; le choix selon la taille de l'entreprise est une recommandation
      de consultant à confirmer avec le client.
  - value: 'Manufacture : Pick components and then manufacture (2 steps).'
    verified: false
    note: Les libellés viennent de la doc ; le choix selon la taille de l'entreprise est une recommandation
      de consultant à confirmer avec le client.
  prerequisites:
  - inv_multi_step_routes
  - inv_warehouse
  applies_when:
    modules:
    - mrp
  sources:
  - path: content/applications/inventory_and_mrp/manufacturing/basic_setup/one_step_manufacturing.rst
    title: One-step manufacturing
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/manufacturing/basic_setup/one_step_manufacturing.html
  - path: content/applications/inventory_and_mrp/manufacturing/basic_setup/two_step_manufacturing.rst
    title: Two-step manufacturing
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/manufacturing/basic_setup/two_step_manufacturing.html
- id: mrp_product
  title: Produits fabriqués
  objective: Déclarer les produits finis et semi-finis comme fabricables.
  menu_path: Manufacturing > Products > Products
  recommendations:
  - value: 'Onglet Inventory : route Manufacture cochée ; Tracking By Lots dans la section Traceability.'
    when:
      tracks_lots: true
  - value: 'Onglet Inventory : route Manufacture cochée.'
  prerequisites:
  - inv_uom
  - inv_product_categories
  applies_when:
    modules:
    - mrp
  sources:
  - path: content/applications/inventory_and_mrp/manufacturing/basic_setup/configure_manufacturing_product.rst
    title: Manufacturing product configuration
    anchor: manufacturing/management/configure-manufacturing-product
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/manufacturing/basic_setup/configure_manufacturing_product.html#manufacturing-management-configure-manufacturing-product
- id: mrp_bom
  title: Nomenclatures
  objective: Décrire pour chaque produit fabriqué ses composants et ses opérations.
  menu_path: Manufacturing app > Products > Bills of Materials
  recommendations:
  - value: 'BoM Type : Manufacture this Product ; composants avec leurs quantités ; opérations rattachées
      aux postes de travail.'
  prerequisites:
  - mrp_work_centers
  - mrp_product
  - inv_components
  applies_when:
    modules:
    - mrp
  sources:
  - path: content/applications/inventory_and_mrp/manufacturing/basic_setup/bill_configuration.rst
    title: Bill of materials
    anchor: manufacturing/basic_setup/bom-setup
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/manufacturing/basic_setup/bill_configuration.html#manufacturing-basic-setup-bom-setup
- id: inv_reordering_rules
  title: Règles de réapprovisionnement
  objective: Déclencher automatiquement achats et fabrications quand le stock prévu passe sous un minimum.
  menu_path: Inventory app > Operations > Replenishment
  recommendations:
  - value: Une règle par composant acheté (route Buy) et par produit fini stocké (route Manufacture) ;
      quantités minimum et maximum à fixer avec le client.
  prerequisites:
  - inv_components
  - mrp_product
  sources:
  - path: content/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/reordering_rules.rst
    title: Reordering rules
    anchor: inventory/warehouses_storage/configure-rr
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/reordering_rules.html#inventory-warehouses-storage-configure-rr
- id: mrp_mto
  title: Fabrication à la commande
  objective: Lancer un ordre de fabrication à chaque commande client pour les produits faits sur mesure.
  menu_path: Inventory app > Configuration > Routes
  recommendations:
  - value: Désarchiver la route Replenish on Order (MTO), puis la cocher avec Manufacture sur les produits
      fabriqués à la commande.
  prerequisites:
  - inv_multi_step_routes
  - mrp_product
  applies_when:
    make_to_order: true
    modules:
    - mrp
  sources:
  - path: content/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/mto.rst
    title: Replenish on order (MTO)
    anchor: inventory/warehouses_storage/unarchive-mto
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/warehouses_storage/replenishment/mto.html#inventory-warehouses-storage-unarchive-mto
- id: inv_initial_quantities
  title: Stock initial
  objective: Charger les quantités en stock au démarrage, par article et par emplacement.
  menu_path: Inventory app > Operations > Physical Inventory
  recommendations:
  - value: Saisir la Counted Quantity de chaque article par emplacement (et par lot), puis Apply.
    note: La doc décrit le dénombrement ; l'import des quantités par fichier n'y est pas décrit pour cette
      page.
  prerequisites:
  - inv_locations
  - inv_lots
  - inv_components
  - mrp_product
  sources:
  - path: content/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/count_products.rst
    title: Inventory adjustments
    anchor: inventory/create-adjustment
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/inventory/warehouses_storage/inventory_management/count_products.html#inventory-create-adjustment
- id: mrp_first_mo
  title: Ordre de fabrication de recette
  objective: Valider le paramétrage de bout en bout avec un premier ordre de fabrication.
  menu_path: Manufacturing > Operations > Manufacturing Orders
  recommendations:
  - value: Créer un ordre de fabrication sur un produit fini, vérifier la consommation des composants
      et l'entrée en stock du produit.
  prerequisites:
  - mrp_manufacturing_steps
  - mrp_bom
  - inv_initial_quantities
  applies_when:
    modules:
    - mrp
  sources:
  - path: content/applications/inventory_and_mrp/manufacturing/basic_setup/one_step_manufacturing.rst
    title: One-step manufacturing
    url: https://www.odoo.com/documentation/18.0/fr/applications/inventory_and_mrp/manufacturing/basic_setup/one_step_manufacturing.html
