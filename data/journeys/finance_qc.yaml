# Parcours Finance, société québécoise (Odoo 18).
# Vérifié contre odoo/documentation 18.0, commit 221e829ac894c79b0f270892c1e02425a0ef4214.
# Chemins de menu en anglais, tels qu'écrits dans la doc. verified: false = à confirmer.

id: finance_qc
title: Finance, société québécoise
domain: Finance
description: 'Comptabilité d''une société établie au Québec : localisation canadienne, TPS et TVQ, plan
  comptable, journaux, exercice fiscal, devise et conditions de paiement.'
erp: odoo
version: '18.0'
applies_when:
  country:
  - CA
  province:
  - QC
  modules:
  - account
steps:
- id: fin_company
  title: Fiche de la société
  parameter: company_identity
  objective: 'Renseigner l''identité légale de la société : nom, adresse au Québec, numéro fiscal et devise.
    Ces données alimentent les documents (factures) et le choix de la localisation.'
  menu_path: Settings > Users & Companies > Companies
  recommendations:
  - value: 'Pays : Canada, province : Québec, adresse complète, devise CAD. Numéros de TPS et de TVQ saisis
      sur la fiche société.'
    verified: false
    note: La doc Odoo 18 décrit un seul champ Tax ID et précise que les informations générales varient
      selon la localisation. L'emplacement exact des numéros de TPS et de TVQ avec l10n_ca est à vérifier
      dans une base Odoo 18.
  prerequisites: []
  sources:
  - path: content/applications/general/companies.rst
    title: Companies
    anchor: general/companies/company
    url: https://www.odoo.com/documentation/18.0/fr/applications/general/companies.html#general-companies-company
- id: fin_localization
  title: Paquet de localisation canadien
  parameter: fiscal_localization
  objective: 'Vérifier que le paquet de localisation fiscale Canada est installé : il fournit le plan
    comptable, les taxes, les positions fiscales et les rapports canadiens.'
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: 'Champ Package de la section Fiscal Localization : localisation canadienne (module Canada -
      Accounting, l10n_ca), avec Canada - Accounting Reports (l10n_ca_reports).'
    note: Le paquet ne peut être changé que tant qu'aucune écriture n'a été comptabilisée.
  prerequisites:
  - fin_company
  modules:
  - l10n_ca
  sources:
  - path: content/applications/finance/fiscal_localizations.rst
    title: Fiscal localizations
    anchor: fiscal_localizations/packages
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations.html#fiscal-localizations-packages
  - path: content/applications/finance/fiscal_localizations/canada.rst
    title: Canada
    anchor: localizations/canada/modules
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/canada.html#localizations-canada-modules
- id: fin_main_currency
  title: Devise principale
  parameter: main_currency
  objective: Confirmer la devise de tenue de la comptabilité. Elle est définie par défaut selon le pays
    de la société.
  menu_path: Accounting > Configuration > Settings > Currencies
  recommendations:
  - value: 'Main Currency : CAD (dollar canadien).'
    verified: false
    note: La doc indique seulement que la devise principale dépend du pays de la société ; la valeur CAD
      pour une société canadienne n'y est pas écrite.
  prerequisites:
  - fin_localization
  sources:
  - path: content/applications/finance/accounting/get_started/multi_currency.rst
    title: Multi-currency system
    anchor: multi-currency/config-main-currency
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started/multi_currency.html#multi-currency-config-main-currency
- id: fin_foreign_currencies
  title: Devises étrangères
  parameter: foreign_currencies
  objective: Activer les devises dans lesquelles la société facture ou achète, en plus de la devise principale.
  menu_path: Accounting > Configuration > Currencies
  recommendations:
  - value: Activer (bouton Active) chaque devise listée dans le profil, par exemple USD.
  prerequisites:
  - fin_main_currency
  applies_when:
    foreign_currencies: true
  sources:
  - path: content/applications/finance/accounting/get_started/multi_currency.rst
    title: Multi-currency system
    anchor: multi-currency/config-enable
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started/multi_currency.html#multi-currency-config-enable
- id: fin_fiscal_year
  title: Exercice fiscal
  parameter: fiscal_year
  objective: Définir les dates d'ouverture et de clôture de l'exercice, utilisées pour générer les rapports.
  menu_path: Accounting > Configuration > Settings > Fiscal Periods
  recommendations:
  - value: Date de clôture de l'exercice reprise du profil (par défaut 31 décembre, valeur par défaut
      d'Odoo).
    note: La date de clôture propre à la société est à confirmer avec son comptable.
  prerequisites:
  - fin_localization
  modules:
  - account_accountant
  sources:
  - path: content/applications/finance/accounting/get_started.rst
    title: Get started
    anchor: accounting-setup-periods
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started.html#accounting-setup-periods
  - path: content/applications/finance/accounting/reporting/year_end.rst
    title: Year-end closing
    anchor: year-end/fiscal-years
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/reporting/year_end.html#year-end-fiscal-years
- id: fin_chart_of_accounts
  title: Plan comptable canadien
  parameter: chart_of_accounts
  objective: Revoir le plan comptable installé par la localisation et l'adapter à la société sans casser
    les comptes utilisés par Odoo.
  menu_path: Accounting > Configuration > Chart of Accounts
  recommendations:
  - value: Conserver les comptes prédéfinis du plan canadien (Bank Suspense Account, Outstanding Receipts,
      Stock Valuation, etc.) ; les renommer plutôt que les supprimer, et ajouter les comptes propres à
      la société.
  prerequisites:
  - fin_localization
  sources:
  - path: content/applications/finance/fiscal_localizations/canada.rst
    title: Canada
    anchor: localizations/canada/coa
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/canada.html#localizations-canada-coa
  - path: content/applications/finance/accounting/get_started/chart_of_accounts.rst
    title: Chart of accounts
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started/chart_of_accounts.html
- id: fin_taxes
  title: Taxes TPS et TVQ
  parameter: taxes
  objective: Vérifier et activer les taxes de vente et d'achat créées par la localisation. Seul le taux
    principal est actif par défaut ; les autres s'activent depuis la liste des taxes.
  menu_path: Accounting > Configuration > Taxes
  recommendations:
  - value: Taxes de vente et d'achat actives pour la TPS (5 %) et la TVQ (9,975 %) applicables au Québec
      ; désactiver les taxes inutiles.
    verified: false
    note: Les taux de TPS et de TVQ ne figurent pas dans la doc Odoo 18. Vérifier les taxes créées par
      l10n_ca dans la base et les taux en vigueur auprès de l'ARC et de Revenu Québec.
  prerequisites:
  - fin_localization
  sources:
  - path: content/applications/finance/fiscal_localizations/canada.rst
    title: Canada
    anchor: localizations/canada/taxes
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/canada.html#localizations-canada-taxes
  - path: content/applications/finance/accounting/taxes.rst
    title: Taxes
    anchor: taxes/list_activation
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/taxes.html#taxes-list-activation
- id: fin_fiscal_positions
  title: Positions fiscales par province
  parameter: fiscal_positions
  objective: Faire correspondre les taxes selon la province du client ou du fournisseur. Au Canada, c'est
    la province de livraison qui détermine les taxes.
  menu_path: Accounting > Configuration > Fiscal Positions
  recommendations:
  - value: 'Garder les positions fiscales créées par défaut (Quebec (QC), Ontario (ON), International
      (INTL), etc.). Client livré dans une autre province : position de sa province. Client qui vient
      chercher sa marchandise : aucune position. Fournisseur étranger sans taxe, taxes perçues par le
      courtier en douane : International.'
  prerequisites:
  - fin_taxes
  sources:
  - path: content/applications/finance/fiscal_localizations/canada.rst
    title: Canada
    anchor: localizations/canada/fiscal-positions
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/canada.html#localizations-canada-fiscal-positions
  - path: content/applications/finance/accounting/taxes/fiscal_positions.rst
    title: Fiscal positions (tax and account mapping)
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/taxes/fiscal_positions.html
- id: fin_default_taxes
  title: Taxes par défaut
  parameter: taxes
  objective: Définir les taxes de vente et d'achat posées automatiquement sur les nouveaux articles.
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: 'Sales Tax et Purchase Tax par défaut : les taxes TPS et TVQ du Québec activées à l''étape
      précédente.'
    verified: false
    note: 'La doc décrit le réglage Default taxes, pas la valeur à retenir pour le Québec : choix à confirmer
      selon les ventes de la société.'
  prerequisites:
  - fin_taxes
  sources:
  - path: content/applications/finance/accounting/taxes.rst
    title: Taxes
    anchor: taxes/default
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/taxes.html#taxes-default
- id: fin_tax_periodicity
  title: Périodicité des déclarations de taxes
  parameter: tax_returns
  objective: Paramétrer la fréquence des déclarations, le rappel et le journal de comptabilisation, pour
    qu'Odoo calcule la déclaration sur la bonne période.
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: Periodicity selon la fréquence de déclaration attribuée par l'ARC et Revenu Québec (souvent
      trimestrielle pour une PME), rappel quelques jours avant l'échéance.
    verified: false
    note: Les fréquences et seuils de déclaration de l'ARC et de Revenu Québec ne sont pas dans la doc
      Odoo ; à confirmer avec le comptable de la société.
  prerequisites:
  - fin_taxes
  modules:
  - account_reports
  sources:
  - path: content/applications/finance/accounting/reporting/tax_returns.rst
    title: Tax return (VAT declaration)
    anchor: tax-returns/periodicity
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/reporting/tax_returns.html#tax-returns-periodicity
- id: fin_journals
  title: Journaux
  parameter: journals
  objective: 'Vérifier les journaux comptables qui classent les écritures : banque, caisse, carte de crédit,
    ventes, achats et opérations diverses.'
  menu_path: Accounting > Configuration > Journals
  recommendations:
  - value: Un journal par type utilisé parmi les six types d'Odoo (Bank, Cash, Credit Card, Sales, Purchase,
      Miscellaneous), chacun avec un code court unique de 1 à 5 caractères.
  prerequisites:
  - fin_chart_of_accounts
  sources:
  - path: content/applications/finance/accounting/get_started/journals.rst
    title: Journals
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started/journals.html
- id: fin_bank_account
  title: Comptes bancaires
  parameter: bank_accounts
  objective: Relier chaque compte bancaire de la société à un journal de banque, avec synchronisation
    automatique des relevés si l'établissement est proposé.
  menu_path: Accounting > Configuration > Add a Bank Account
  recommendations:
  - value: 'Un compte par compte bancaire de la société : Connect si la banque figure dans la liste de
      synchronisation, sinon création manuelle (Name, Account Number, Bank).'
  prerequisites:
  - fin_main_currency
  - fin_journals
  sources:
  - path: content/applications/finance/accounting/get_started.rst
    title: Get started
    anchor: accounting-setup-bank
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started.html#accounting-setup-bank
- id: fin_opening_balances
  title: Soldes d'ouverture
  parameter: opening_balances
  objective: Reprendre les soldes de départ à la date de bascule, pour que la balance d'Odoo corresponde
    à la comptabilité précédente.
  menu_path: Accounting > Configuration > Chart of Accounts
  recommendations:
  - value: Soldes d'ouverture des comptes généraux saisis depuis le plan comptable à la date de bascule
      ; soldes clients et fournisseurs repris par leurs factures ouvertes.
    verified: false
    note: 'La doc confirme la saisie des soldes d''ouverture des comptes (Chart of Accounts du bandeau
      de démarrage). Elle ne couvre pas la reprise des soldes clients et fournisseurs : méthode à confirmer.'
  prerequisites:
  - fin_chart_of_accounts
  - fin_journals
  - fin_fiscal_year
  sources:
  - path: content/applications/finance/accounting/get_started.rst
    title: Get started
    anchor: accounting-setup-chart
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started.html#accounting-setup-chart
  - path: content/applications/finance/accounting/get_started/chart_of_accounts.rst
    title: Chart of accounts
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started/chart_of_accounts.html
- id: fin_payment_terms
  title: Conditions de paiement
  parameter: payment_terms
  objective: Définir les conditions de paiement (échéances, escomptes) utilisées sur les commandes, factures
    et factures fournisseurs.
  menu_path: Accounting > Configuration > Payment Terms
  recommendations:
  - value: Net 30 par défaut pour les clients ; condition avec escompte au besoin (par exemple 2 % 10,
      Net 30).
    verified: false
    note: Pratique courante à confirmer avec le client. La doc donne des exemples (15 Days, 2% 10, Net
      30 EOM) mais pas de valeur recommandée.
  prerequisites:
  - fin_localization
  sources:
  - path: content/applications/finance/accounting/customer_invoices/payment_terms.rst
    title: Payment terms and installment plans
    anchor: accounting/payment-terms/configuration
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/customer_invoices/payment_terms.html#accounting-payment-terms-configuration
  - path: content/applications/finance/fiscal_localizations/canada.rst
    title: Canada
    anchor: localizations/canada/cash-discount
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/canada.html#localizations-canada-cash-discount
- id: fin_check_printing
  title: Impression des chèques
  parameter: check_printing
  objective: Permettre l'impression des paiements fournisseurs sur papier chèque pré-imprimé, avec le
    module Canadian Checks Layout (l10n_ca_check_printing).
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: 'Section Vendor Payments : cocher Checks, Check Layout Print Check (Top) - CA, (Middle) - CA
      ou (Bottom) - CA selon le papier utilisé.'
  prerequisites:
  - fin_bank_account
  applies_when:
    uses_checks: true
  modules:
  - l10n_ca_check_printing
  sources:
  - path: content/applications/finance/fiscal_localizations/canada.rst
    title: Canada
    anchor: localizations/canada/writing-checks
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/canada.html#localizations-canada-writing-checks
- id: fin_lock_dates
  title: Dates de verrouillage
  parameter: lock_dates
  objective: Empêcher la modification des écritures d'une période close.
  menu_path: Accounting > Accounting > Lock Dates
  recommendations:
  - value: Lock Everything au dernier jour de l'exercice précédent, une fois la clôture faite.
  prerequisites:
  - fin_fiscal_year
  modules:
  - account_accountant
  sources:
  - path: content/applications/finance/accounting/reporting/year_end.rst
    title: Year-end closing
    anchor: year-end/lock-everything-date
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/reporting/year_end.html#year-end-lock-everything-date
- id: fin_reports
  title: Rapports financiers canadiens
  parameter: financial_reports
  objective: Contrôler que le bilan et l'état des résultats canadiens sont disponibles et cohérents avec
    le plan comptable.
  menu_path: Accounting app > Reporting
  recommendations:
  - value: Ouvrir Balance Sheet et Profit & Loss en choisissant Balance sheet (CA) et Profit and loss
      (CA) dans le filtre Report.
  prerequisites:
  - fin_chart_of_accounts
  - fin_taxes
  modules:
  - l10n_ca_reports
  sources:
  - path: content/applications/finance/fiscal_localizations/canada.rst
    title: Canada
    anchor: localizations/canada/reports
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/canada.html#localizations-canada-reports
- id: fin_tax_report
  title: Grilles du rapport de taxes
  parameter: tax_returns
  objective: Vérifier que les taxes utilisées alimentent les bonnes grilles du rapport de taxes avant
    la première déclaration.
  menu_path: Accounting > Reporting > Tax Return
  recommendations:
  - value: Contrôler les Tax Grids des écritures d'une facture et d'une facture fournisseur de test, puis
      le rapport de taxes de la période.
  prerequisites:
  - fin_taxes
  - fin_tax_periodicity
  modules:
  - account_reports
  sources:
  - path: content/applications/finance/accounting/reporting/tax_returns.rst
    title: Tax return (VAT declaration)
    anchor: tax-returns/tax-grids
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/reporting/tax_returns.html#tax-returns-tax-grids
