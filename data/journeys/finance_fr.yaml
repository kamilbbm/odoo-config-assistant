# Parcours Finance, société française (Odoo 18).
# Vérifié contre odoo/documentation 18.0, commit 221e829ac894c79b0f270892c1e02425a0ef4214.
# Chemins de menu en anglais, tels qu'écrits dans la doc. verified: false = à confirmer.

id: finance_fr
title: Finance, société française
domain: Finance
description: 'Comptabilité d''une société établie en France métropolitaine : localisation française, TVA,
  plan comptable, journaux, paiements SEPA, facturation électronique, FEC et clôture.'
erp: odoo
version: '18.0'
applies_when:
  country:
  - FR
  modules:
  - account
steps:
- id: frf_company
  title: Fiche de la société
  objective: 'Renseigner l''identité légale de la société : raison sociale, adresse en France, numéro
    de TVA, numéro d''immatriculation et SIRET. Ces données alimentent les factures, la facturation électronique
    et Chorus Pro.'
  menu_path: Settings > Users & Companies > Companies
  recommendations:
  - value: 'Pays : France, adresse complète du siège, devise EUR. Tax ID : numéro de TVA intracommunautaire
      ; Company ID : numéro d''immatriculation (SIREN) ; champ SIRET renseigné.'
    verified: false
    note: La doc Odoo 18 décrit les champs Tax ID et Company ID (numéro d'immatriculation) et exige le
      SIRET sur la fiche société pour Chorus Pro. Le choix du SIREN dans Company ID est à vérifier dans
      une base Odoo 18 avec l10n_fr_account.
  prerequisites: []
  sources:
  - path: content/applications/general/companies.rst
    title: Companies
    anchor: general/companies/company
    url: https://www.odoo.com/documentation/18.0/fr/applications/general/companies.html#general-companies-company
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/e-invoicing-choruspro-invoices
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-e-invoicing-choruspro-invoices
- id: frf_localization
  title: Paquet de localisation français
  objective: 'Vérifier que le paquet de localisation fiscale France est installé : il fournit le plan
    comptable, les taxes, les positions fiscales et les rapports français.'
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: 'Champ Package de la section Fiscal Localization : France - Accounting (l10n_fr_account), avec
      France - Accounting Reports (l10n_fr_reports) et France - E-Invoicing (Approved Platform) (l10n_fr_pdp),
      installés automatiquement.'
    note: Le paquet français ne s'applique qu'aux sociétés de France métropolitaine, pas aux DOM-TOM.
      Il ne peut être changé que tant qu'aucune écriture n'a été comptabilisée.
  prerequisites:
  - frf_company
  modules:
  - l10n_fr_account
  sources:
  - path: content/applications/finance/fiscal_localizations.rst
    title: Fiscal localizations
    anchor: fiscal_localizations/packages
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations.html#fiscal-localizations-packages
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/configuration/modules
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-configuration-modules
- id: frf_main_currency
  title: Devise principale
  objective: Confirmer la devise de tenue de la comptabilité. Elle est définie par défaut selon le pays
    de la société.
  menu_path: Accounting > Configuration > Settings > Currencies
  recommendations:
  - value: 'Main Currency : EUR (euro).'
    verified: false
    note: La doc indique seulement que la devise principale dépend du pays de la société ; la valeur EUR
      pour une société française n'y est pas écrite.
  prerequisites:
  - frf_localization
  sources:
  - path: content/applications/finance/accounting/get_started/multi_currency.rst
    title: Multi-currency system
    anchor: multi-currency/config-main-currency
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started/multi_currency.html#multi-currency-config-main-currency
- id: frf_foreign_currencies
  title: Devises étrangères
  objective: Activer les devises dans lesquelles la société facture ou achète, en plus de l'euro.
  menu_path: Accounting > Configuration > Currencies
  recommendations:
  - value: Activer (bouton Active) chaque devise listée dans le profil, par exemple USD ou GBP.
  prerequisites:
  - frf_main_currency
  applies_when:
    foreign_currencies: true
  sources:
  - path: content/applications/finance/accounting/get_started/multi_currency.rst
    title: Multi-currency system
    anchor: multi-currency/config-enable
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started/multi_currency.html#multi-currency-config-enable
- id: frf_fiscal_year
  title: Exercice fiscal
  objective: Définir les dates d'ouverture et de clôture de l'exercice, utilisées pour générer les rapports,
    le FEC et la liasse fiscale.
  menu_path: Accounting > Configuration > Settings > Fiscal Periods
  recommendations:
  - value: Date de clôture de l'exercice reprise du profil (par défaut 31 décembre, valeur par défaut
      d'Odoo).
    note: La date de clôture est celle des statuts de la société, à confirmer avec son expert-comptable.
  prerequisites:
  - frf_localization
  modules:
  - account_accountant
  sources:
  - path: content/applications/finance/accounting/get_started.rst
    title: Get started
    anchor: accounting-setup-periods
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started.html#accounting-setup-periods
  - path: content/applications/finance/accounting/reporting/year_end.rst
    title: Year-end closing
    anchor: year-end/fiscal-years
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/reporting/year_end.html#year-end-fiscal-years
- id: frf_chart_of_accounts
  title: Plan comptable français
  objective: Revoir le plan comptable installé par la localisation et l'adapter à la société sans casser
    les comptes utilisés par Odoo.
  menu_path: Accounting > Configuration > Chart of Accounts
  recommendations:
  - value: Conserver la structure du plan comptable prédéfini par la localisation française ; ajouter
      les comptes propres à la société plutôt que de supprimer des comptes existants.
    verified: false
    note: La doc indique que la localisation fournit un plan comptable conforme aux normes françaises,
      sans détailler les comptes. Le niveau de détail (sous-comptes) est à valider avec l'expert-comptable.
  prerequisites:
  - frf_localization
  sources:
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/loc-overview
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-loc-overview
  - path: content/applications/finance/accounting/get_started/chart_of_accounts.rst
    title: Chart of accounts
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started/chart_of_accounts.html
- id: frf_taxes
  title: Taxes de TVA
  objective: Vérifier et activer les taxes de vente et d'achat créées par la localisation (TVA à taux
    normal, réduits, taux zéro et exonérations), puis définir les taxes par défaut des nouveaux articles.
  menu_path: Accounting > Configuration > Taxes
  recommendations:
  - value: 'Taxes de TVA actives aux taux utilisés par la société (normal 20 %, intermédiaire 10 %, réduit
      5,5 %, particulier 2,1 %) ; désactiver les taxes inutiles. Default taxes (Accounting > Configuration
      > Settings) : TVA 20 % en vente et en achat.'
    verified: false
    note: La doc Odoo 18 mentionne des taux de TVA préconfigurés (normal, zéro, exonéré) sans les chiffrer.
      Vérifier les taxes créées par l10n_fr_account dans la base et les taux en vigueur sur impots.gouv.fr.
  prerequisites:
  - frf_localization
  sources:
  - path: content/applications/finance/accounting/taxes.rst
    title: Taxes
    anchor: taxes/list_activation
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/taxes.html#taxes-list-activation
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/loc-overview
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-loc-overview
- id: frf_fiscal_positions
  title: Positions fiscales
  objective: Adapter automatiquement les taxes et les comptes selon le client ou le fournisseur (France,
    Union européenne, hors Union européenne).
  menu_path: Accounting > Configuration > Fiscal Positions
  recommendations:
  - value: 'Garder les positions fiscales créées par la localisation et vérifier leurs correspondances
      : client ou fournisseur intracommunautaire assujetti (autoliquidation), export hors UE (exonération).
      Activer Detect Automatically avec le pays et, pour l''UE, VAT required.'
    verified: false
    note: La doc décrit le mécanisme des positions fiscales et leur détection automatique, pas la liste
      des positions créées par l10n_fr_account. À vérifier dans la base.
  prerequisites:
  - frf_taxes
  sources:
  - path: content/applications/finance/accounting/taxes/fiscal_positions.rst
    title: Fiscal positions (tax and account mapping)
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/taxes/fiscal_positions.html
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/loc-overview
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-loc-overview
- id: frf_tax_periodicity
  title: Périodicité des déclarations de TVA
  objective: Paramétrer la fréquence des déclarations de TVA, le rappel et le journal de comptabilisation,
    pour qu'Odoo calcule la déclaration sur la bonne période.
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: Periodicity selon le régime de TVA de la société (réel normal, mensuel ou trimestriel ; régime
      simplifié, annuel), rappel quelques jours avant l'échéance.
    verified: false
    note: Les régimes et échéances de TVA de la DGFiP ne sont pas dans la doc Odoo ; à confirmer avec
      l'expert-comptable de la société.
  prerequisites:
  - frf_taxes
  modules:
  - account_reports
  sources:
  - path: content/applications/finance/accounting/reporting/tax_returns.rst
    title: Tax return (VAT declaration)
    anchor: tax-returns/periodicity
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/reporting/tax_returns.html#tax-returns-periodicity
- id: frf_journals
  title: Journaux
  objective: 'Vérifier les journaux comptables qui classent les écritures : banque, caisse, carte de crédit,
    ventes, achats et opérations diverses.'
  menu_path: Accounting > Configuration > Journals
  recommendations:
  - value: Un journal par type utilisé parmi les six types d'Odoo (Bank, Cash, Credit Card, Sales, Purchase,
      Miscellaneous), chacun avec un code court unique de 1 à 5 caractères.
  prerequisites:
  - frf_chart_of_accounts
  sources:
  - path: content/applications/finance/accounting/get_started/journals.rst
    title: Journals
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started/journals.html
- id: frf_bank_account
  title: Comptes bancaires
  objective: Relier chaque compte bancaire de la société à un journal de banque, avec synchronisation
    automatique des relevés si l'établissement est proposé.
  menu_path: Accounting > Configuration > Add a Bank Account
  recommendations:
  - value: 'Un compte par compte bancaire de la société, avec son IBAN : Connect si la banque figure dans
      la liste de synchronisation, sinon création manuelle (Name, Account Number, Bank).'
  prerequisites:
  - frf_main_currency
  - frf_journals
  sources:
  - path: content/applications/finance/accounting/get_started.rst
    title: Get started
    anchor: accounting-setup-bank
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started.html#accounting-setup-bank
- id: frf_sepa
  title: Paiements SEPA
  objective: Payer les fournisseurs par virement SEPA (SCT) et, si la société encaisse par prélèvement,
    gérer les mandats SEPA (SDD). Ces moyens de paiement ne valent que pour l'euro.
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: 'Section Customer Payments : activer SEPA Direct Debit (SDD) et saisir le Creditor Identifier
      (ICS) fourni par la banque. Section Vendor Payments : activer SEPA Credit Transfer (SCT), puis ajouter
      SEPA Credit Transfer aux Outgoing Payments du journal de banque.'
    when:
      uses_direct_debit: true
  - value: 'Section Vendor Payments : activer SEPA Credit Transfer (SCT) et renseigner les données de
      la société, puis ajouter SEPA Credit Transfer aux Outgoing Payments du journal de banque.'
  prerequisites:
  - frf_bank_account
  modules:
  - account_iso20022
  sources:
  - path: content/applications/finance/accounting/payments/sepa_payments.rst
    title: SEPA payments
    anchor: accounting/sepa_payments/sct_configuration
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/payments/sepa_payments.html#accounting-sepa-payments-sct-configuration
  - path: content/applications/finance/accounting/payments/sepa_payments.rst
    title: SEPA payments
    anchor: accounting/sepa_payments/sdd_configuration
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/payments/sepa_payments.html#accounting-sepa-payments-sdd-configuration
- id: frf_opening_balances
  title: Soldes d'ouverture et reprise de l'historique
  objective: Reprendre les soldes de départ, ou l'historique des écritures, à la date de bascule pour
    que la balance d'Odoo corresponde à la comptabilité précédente.
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: Soldes d'ouverture des comptes généraux saisis depuis le plan comptable (Accounting > Configuration
      > Chart of Accounts) à la date de bascule ; l'historique reste dans l'ancien logiciel.
    when:
      imports_fec_history: true
      edition: community
    verified: false
    note: L'import FEC (l10n_fr_fec_import) n'existe pas dans l'édition Community. La reprise des soldes
      clients et fournisseurs est à confirmer.
  - value: 'Installer France - FEC Import (l10n_fr_fec_import), puis section Accounting Import : Import,
      Import FEC et charger le FEC de l''ancien logiciel. Supprimer au besoin les écritures de reports
      à nouveaux (RAN) marquées comme inutiles.'
    when:
      imports_fec_history: true
  - value: Soldes d'ouverture des comptes généraux saisis depuis le plan comptable (Accounting > Configuration
      > Chart of Accounts) à la date de bascule ; soldes clients et fournisseurs repris par leurs factures
      ouvertes.
    verified: false
    note: 'La doc confirme la saisie des soldes d''ouverture des comptes. Elle ne couvre pas la reprise
      des soldes clients et fournisseurs : méthode à confirmer.'
  prerequisites:
  - frf_chart_of_accounts
  - frf_journals
  - frf_fiscal_year
  sources:
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/fec-import
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-fec-import
  - path: content/applications/finance/accounting/get_started.rst
    title: Get started
    anchor: accounting-setup-chart
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/get_started.html#accounting-setup-chart
- id: frf_payment_terms
  title: Conditions de paiement
  objective: Définir les conditions de paiement (échéances, escomptes) utilisées sur les commandes, factures
    et factures fournisseurs.
  menu_path: Accounting > Configuration > Payment Terms
  recommendations:
  - value: 30 jours par défaut pour les clients, sans dépasser les délais légaux entre professionnels
      (60 jours date de facture ou 45 jours fin de mois).
    verified: false
    note: Les délais de paiement légaux (Code de commerce) ne figurent pas dans la doc Odoo. Valeur à
      confirmer avec le client et son expert-comptable.
  prerequisites:
  - frf_localization
  sources:
  - path: content/applications/finance/accounting/customer_invoices/payment_terms.rst
    title: Payment terms and installment plans
    anchor: accounting/payment-terms/configuration
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/customer_invoices/payment_terms.html#accounting-payment-terms-configuration
- id: frf_e_invoicing
  title: Facturation électronique (plateforme agréée)
  objective: Inscrire la société sur le réseau de facturation électronique via Odoo, plateforme agréée,
    pour recevoir et émettre les factures B2B domestiques et transmettre l'e-reporting.
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: 'Section French Electronic Invoicing : Activate Electronic Invoicing, authentification du représentant
      légal, Identifier = SIREN, puis Validate Registration. Réception obligatoire pour toutes les entreprises
      depuis le 1er septembre 2026 ; émission et e-reporting obligatoires pour les PME et micro-entreprises
      au 1er septembre 2027.'
    note: Activer Enable e-reporting & sending of invoices to the PPF et l'E-Reporting Periodicity dès
      que l'émission devient obligatoire pour la société. Vérifier chaque client sur l'annuaire (bouton
      Verify de la fiche contact) avant le premier envoi.
  prerequisites:
  - frf_company
  - frf_journals
  modules:
  - l10n_fr_pdp
  sources:
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/e-invoicing-fac-elec-config
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-e-invoicing-fac-elec-config
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/b2b-b2c
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-b2b-b2c
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/e-invoicing-fac-elec-reporting
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-e-invoicing-fac-elec-reporting
- id: frf_chorus_pro
  title: Factures au secteur public (Chorus Pro)
  objective: Envoyer les factures aux entités publiques sur Chorus Pro, obligatoire pour les transactions
    B2G depuis janvier 2020, via le réseau Peppol.
  menu_path: Accounting > Configuration > Settings
  recommendations:
  - value: Installer le module d'intégration Chorus Pro (l10n_fr_facturx_chorus_pro), s'inscrire sur Peppol
      (section PEPPOL Electronic Invoicing), créer le compte Chorus Pro de la société, puis sur chaque
      client public renseigner SIRET, eInvoice format BIS Billing 3.0 et l'identifiant Chorus Pro 11000201100044.
    note: L'inscription au réseau de facturation électronique français inscrit aussi la société sur Peppol.
      La doc nomme le module tantôt Peppol, tantôt Factur-X integration with Chorus Pro.
  prerequisites:
  - frf_company
  - frf_e_invoicing
  applies_when:
    b2g_invoicing: true
  modules:
  - l10n_fr_facturx_chorus_pro
  sources:
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/e-invoicing-choruspro-configuration
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-e-invoicing-choruspro-configuration
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/e-invoicing-choruspro-contacts
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-e-invoicing-choruspro-contacts
- id: frf_tax_report
  title: Rapports et déclaration de TVA
  objective: Vérifier que les taxes alimentent les bonnes grilles du rapport de taxes français avant la
    première déclaration, et que le bilan et le compte de résultat français sont disponibles.
  menu_path: Accounting > Reporting > Tax Return
  recommendations:
  - value: Contrôler les Tax Grids d'une facture et d'une facture fournisseur de test, puis le Rapport
      de taxes (FR) de la période ; ouvrir le Bilan comptable (FR) et le Compte de résultats (FR).
  prerequisites:
  - frf_taxes
  - frf_tax_periodicity
  modules:
  - account_reports
  - l10n_fr_reports
  sources:
  - path: content/applications/finance/accounting/reporting/tax_returns.rst
    title: Tax return (VAT declaration)
    anchor: tax-returns/tax-grids
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/accounting/reporting/tax_returns.html#tax-returns-tax-grids
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/reporting
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-reporting
- id: frf_fec_export
  title: Fichier des écritures comptables (FEC)
  objective: Vérifier que la société peut produire le FEC, exigé par l'administration fiscale en cas de
    contrôle, avant la première clôture.
  menu_path: Accounting > Reporting > General Ledger
  recommendations:
  - value: 'Icône engrenage, FEC : générer un fichier de test (Test File) sur une période, puis le contrôler
      avec l''outil officiel Test-Compta-Demat de la DGFiP.'
  prerequisites:
  - frf_journals
  - frf_fiscal_year
  modules:
  - account_reports
  sources:
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/fec-export
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-fec-export
  - path: content/applications/finance/fiscal_localizations/france.rst
    title: France
    anchor: localizations/france/fec
    url: https://www.odoo.com/documentation/18.0/fr/applications/finance/fiscal_localizations/france.html#localizations-france-fec
- id: frf_year_end
  title: Clôture, liasse fiscale et verrouillage
  objective: Préparer la clôture de l'exercice, transmettre la liasse fiscale par Teledec synchronisé
    avec Odoo, puis empêcher la modification des écritures de la période close.
  menu_path: Accounting > Accounting > Lock Dates
  recommendations:
  - value: Compte Teledec de la société (SIREN), synchronisation de la liasse avec Odoo par clé d'API,
      puis Lock Everything au dernier jour de l'exercice clos.
    note: La liasse se prépare et se transmet sur Teledec ; Odoo fournit la balance par synchronisation.
      L'utilisateur de la clé d'API doit avoir la société comme Default Company.
  prerequisites:
  - frf_fiscal_year
  - frf_tax_report
  modules:
