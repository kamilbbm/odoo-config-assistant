name: Screenshots

# Capture l'interface sur le projet exemple et committe docs/img/*.png.
# Lancement manuel, ou par un push dont le message de commit contient [captures].
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[captures]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -e . playwright
          python -m playwright install --with-deps chromium
      - name: Fetch documentation and build index
        run: |
          python scripts/fetch_docs.py
          python scripts/build_index.py
      - name: Capture
        run: python scripts/capture_screens.py
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/img/*.png
          git diff --cached --quiet || git commit -m "Captures d'écran de la démo (projet exemple)"
          git push
